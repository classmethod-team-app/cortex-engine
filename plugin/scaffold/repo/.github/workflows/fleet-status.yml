name: セットアップ状況の自己チェック
# 実体はエンジン
on:
  schedule:
    # 毎日 朝8:30 JST（UTC 23:30）。他の同期系cronより後にして直近の状態を反映する
    - cron: "30 23 * * *"
  workflow_dispatch:
concurrency:
  group: fleet-status
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  status:
    uses: classmethod-team-app/cortex-engine/.github/workflows/fleet-status.yml@v1
    # 別orgのエンジンを呼ぶ場合 inherit は届かないため明示的に渡す（同一orgでも同じ挙動）
    secrets:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      BACKLOG_API_KEY: ${{ secrets.BACKLOG_API_KEY }}
      BACKLOG_DOMAIN: ${{ secrets.BACKLOG_DOMAIN }}
      BACKLOG_PROJECT_KEY: ${{ secrets.BACKLOG_PROJECT_KEY }}
      ENGINE_REPO_TOKEN: ${{ secrets.ENGINE_REPO_TOKEN }}
      EXTERNAL_SOURCES_TOKEN: ${{ secrets.EXTERNAL_SOURCES_TOKEN }}
      FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
