name: Backlogリアルタイム同期（webhook受信）
# cortex-tools の Backlog Webhook Lambda から repository_dispatch で起動。実体はエンジン
on:
  repository_dispatch:
    types: [backlog-updated]
concurrency:
  group: backlog-realtime-sync
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sync:
    uses: classmethod-team-app/cortex-engine/.github/workflows/backlog-webhook-sync.yml@v1
    # 別orgのエンジンを呼ぶ場合 inherit は届かないため明示的に渡す（同一orgでも同じ挙動）
    secrets:
      BACKLOG_API_KEY: ${{ secrets.BACKLOG_API_KEY }}
      BACKLOG_DOMAIN: ${{ secrets.BACKLOG_DOMAIN }}
      BACKLOG_PROJECT_KEY: ${{ secrets.BACKLOG_PROJECT_KEY }}
