name: Cortex検証
# 実体はエンジン
on:
  pull_request:
    paths:
      - "Cortex/**"
  push:
    branches: [main]
    paths:
      - "Cortex/**"
jobs:
  lint:
    uses: classmethod-team-app/cortex-engine/.github/workflows/validate-cortex.yml@v1
    # 別orgのエンジンを呼ぶ場合 inherit は届かないため明示的に渡す（同一orgでも同じ挙動）
    secrets:
      ENGINE_REPO_TOKEN: ${{ secrets.ENGINE_REPO_TOKEN }}
