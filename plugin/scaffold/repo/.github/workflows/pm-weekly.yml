name: PMハーネス週次レポート（Slack配信）
# 実体はエンジンの汎用ディスパッチ（run-harness-skill）。PMハーネスの weekly-report スキルをヘッドレス実行し、
# 週次レポートを Slack に配信する。レポートはリポジトリに書かない（Gold層に書けるのはエンジンの精製WFだけ）。
# ※ファイル名を変えないこと（増分起点SINCEの算出が gh run list --workflow=このファイル名 に依存）
on:
  schedule:
    # 毎週金曜 21:00 JST（UTC 金 12:00）。その週のまとめを週末前に配信する
    - cron: "0 12 * * 5"
  workflow_dispatch:
    inputs:
      target_date:
        description: "週末日 YYYYMMDD（巻き取り・再送用。空なら実行日）"
        required: false
        default: ""
      since:
        description: "差分起点をISO8601で上書き（バックフィル用。空なら前回成功以降）"
        required: false
        default: ""
concurrency:
  group: pm-weekly
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write # AWS OIDC 認証に必須（スキルは claude -p / Bedrock で走る）
  actions: read   # SINCE算出（gh run list）に必要
jobs:
  weekly:
    uses: classmethod-team-app/cortex-engine/.github/workflows/run-harness-skill.yml@v1
    # 別orgのエンジンを呼ぶ場合 inherit は届かないため明示的に渡す（同一orgでも同じ挙動）
    secrets:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      ENGINE_REPO_TOKEN: ${{ secrets.ENGINE_REPO_TOKEN }}
      EXTERNAL_SOURCES_TOKEN: ${{ secrets.EXTERNAL_SOURCES_TOKEN }}
      HARNESS_REPO_TOKEN: ${{ secrets.HARNESS_REPO_TOKEN }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    with:
      skill: weekly-report
      target_date: ${{ github.event.inputs.target_date || '' }}
      since: ${{ github.event.inputs.since || '' }}
      max_turns: 80
