name: エンジンマイグレーション（データスキーマ更新）

# エンジンの更新がデータ側（frontmatter・ディレクトリ構造・CLAUDE.md）の変更を要する場合に、
# 案件リポのデータを追随させる。案件リポのスタブから workflow_call で呼ばれる（夜間cron＋手動）。
#
# 仕組み:
#   - 案件リポの Cortex/Home.md frontmatter `engine.schema_version` と、
#     エンジンの migrations/ にある最大 to 番号を比較し、未適用分を順に実行する。
#   - 未適用のマイグレーションを**すべて**自動実行して直コミットする（人手待ちのゲートは持たない）。
#     `.github/workflows/` を触るものも含めて通すため、push には FLEET_WORKFLOW_TOKEN を使う
#     （GITHUB_TOKEN はワークフローを push できない。ジョブの permissions でも付与できない仕様）。
on:
  workflow_call:
    inputs:
      engine_ref:
        description: "エンジン（スクリプト等）のcheckout ref。スタブのチャンネルと揃える（stable=v1 / canary=main）"
        required: false
        type: string
        default: "v1"
    secrets:
      # 別orgのスタブから呼ばれる場合 secrets: inherit は届かないため、受け口を明示的に宣言する。
      # 同一orgからの inherit も引き続き有効（後方互換）。未設定の案件では空文字で渡り、各ワークフローの前提チェックがskipに倒す。
      ENGINE_REPO_TOKEN:
        required: false
      # `.github/workflows/` を含む変更を push するためのトークン（Contents + Workflows の書き込み）。
      # **未設定でも動く。** ワークフローを触るマイグレーションが来たときだけ push が失敗する。
      # GITHUB_TOKEN は contents:write を持っているのに workflows だけ持てず、ジョブの
      # permissions でも付与できないため、この1点のためだけに別トークンが要る。
      FLEET_WORKFLOW_TOKEN:
        required: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    # 同一リポ内でmainへ書き込む同期系ワークフローと直列化し、push競合を構造的に減らす。
    concurrency:
      group: cortex-repo-write-${{ github.repository }}
      cancel-in-progress: false
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # マイグレーションがGit履歴を参照できるようにする（例: 0020 は「そのレコードを追加した
          # コミットのauthor」でAI生成か人間かを判定する）。shallowだと全ファイルが1コミットで
          # 追加されたように見え、判定が丸ごと誤る。
          fetch-depth: 0

      - name: エンジンをチェックアウト（このワークフローと同一バージョン）
        uses: actions/checkout@v4
        with:
          repository: classmethod-team-app/cortex-engine
          ref: ${{ job.workflow_sha || inputs.engine_ref }}
          path: .cortex-engine
          token: ${{ secrets.ENGINE_REPO_TOKEN || github.token }}

      - name: エンジンをGit管理対象外にする
        run: echo ".cortex-engine/" >> .git/info/exclude

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 未適用マイグレーションを実行
        run: node .cortex-engine/scripts/engine-migrate.mjs

      - name: 変更があればコミット＆push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "変更なし。スキップ"
            exit 0
          fi
          git commit -m "エンジンマイグレーションを適用（schema_version更新）"

      - name: 堅牢push（未ステージ畳み込み・衝突自動解決・リトライ）
        uses: classmethod-team-app/cortex-engine/.github/actions/robust-push@v1
        with:
          # ワークフローファイルを含む変更も push できるようにする（GITHUB_TOKEN では弾かれる）。
          # 未設定の案件は従来どおり GITHUB_TOKEN で動く（ワークフローを触らない限り支障ない）。
          token: ${{ secrets.FLEET_WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
