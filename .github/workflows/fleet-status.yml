name: セットアップ状況の自己チェック

# 案件リポ自身のセットアップ充足度を算出し、`fleet-status.json` に書き出してコミットする。
# 巡回エージェント／フリート管理は各案件のこのファイルを読んで集約する。
# 案件リポのスタブから workflow_call で呼ばれる。
on:
  workflow_call:
    inputs:
      engine_ref:
        description: "エンジン（スクリプト等）のcheckout ref。スタブのチャンネルと揃える（stable=v1 / canary=main）"
        required: false
        type: string
        default: "v1"
    secrets:
      # 別orgのスタブから呼ばれる場合 secrets: inherit は届かないため、受け口を明示的に宣言する。
      # 同一orgからの inherit も引き続き有効（後方互換）。未設定の案件では空文字で渡り、各ワークフローの前提チェックがskipに倒す。
      AWS_ROLE_TO_ASSUME:
        required: false
      BACKLOG_API_KEY:
        required: false
      BACKLOG_DOMAIN:
        required: false
      BACKLOG_PROJECT_KEY:
        required: false
      ENGINE_REPO_TOKEN:
        required: false
      EXTERNAL_SOURCES_TOKEN:
        required: false
      FIGMA_TOKEN:
        required: false
      SLACK_BOT_TOKEN:
        required: false

jobs:
  status:
    runs-on: ubuntu-latest
    # 同一リポ内でmainへ書き込む同期系ワークフローと直列化し、push競合を構造的に減らす。
    concurrency:
      group: cortex-repo-write-${{ github.repository }}
      cancel-in-progress: false
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 失敗時の原因切り分け用（トークン未達か・トークンのアクセス権不足かを明確にする）
      - name: エンジン取得の事前確認（トークン診断）
        env:
          T: ${{ secrets.ENGINE_REPO_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            # cortex-engine は public 化済みのため、ENGINE_REPO_TOKEN 未設定でも github.token で checkout 可能。
            # 別org（例: classmethod-aws のトライアル）や Free プランで org secret が届かない場合の正常系。
            echo "::notice::ENGINE_REPO_TOKEN 未設定。public 化した cortex-engine を github.token で checkout します。"
            exit 0
          fi
          echo "ENGINE_REPO_TOKEN: 届いています（長さ ${#T}）"
          # 重要: checkout済みリポの中で実行すると actions/checkout が仕込んだ extraheader
          # （GITHUB_TOKEN。cortex-engineは見えない）がURL認証より優先され、正しいトークンでも404になる。
          # リポ外（一時ディレクトリ）で実行して汚染を避ける。
          cd "$(mktemp -d)"
          if git ls-remote "https://x-access-token:${T}@github.com/classmethod-team-app/cortex-engine" HEAD >/dev/null 2>&1; then
            echo "cortex-engine へのアクセス: OK"
          else
            echo "::error::トークンで cortex-engine にアクセスできません。PAT の Resource owner（classmethod-team-app）／Repository access（cortex-engine を選択）／Permissions（Contents: Read-only）／org の承認状態（Pending になっていないか）を確認してください"
            exit 1
          fi

      - name: エンジンをチェックアウト（このワークフローと同一バージョン）
        uses: actions/checkout@v4
        with:
          repository: classmethod-team-app/cortex-engine
          ref: ${{ github.job_workflow_sha || inputs.engine_ref }}
          path: .cortex-engine
          token: ${{ secrets.ENGINE_REPO_TOKEN || github.token }}

      - name: エンジンをGit管理対象外にする
        run: echo ".cortex-engine/" >> .git/info/exclude

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # `secrets` は if: で直接参照できないので、一度 env に落としてから判定する。
      - name: AWSロールの有無を判定
        id: awsrole
        env:
          ROLE: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          if [ -n "${ROLE:-}" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi

      - name: AWS認証（Secrets Manager を見るため。未設定ならスキップ）
        id: awsauth
        if: steps.awsrole.outputs.has == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-northeast-1

      # 認証が壊れたときに黙ってフォールバックへ落ちると、「読めない」が「未設定」に丸まる。
      - name: AWS認証の失敗を記録（続行はする）
        if: steps.awsauth.outcome == 'failure'
        run: echo "::warning::AWS認証に失敗しました。従来の repo secret で続行します（設定UIから投入した値は効きません）"

      # 設定UIから投入されたトークンは Secrets Manager に入る。移行が済んだ案件では
      # repo secret が消えるので、**両方を見ないと充足度が軒並み落ちる**（移行できたかを
      # 見るための計器が、移行すると赤くなる）。
      # ここでは値を読まず、存在だけを確かめる（状況表示のジョブがトークンの中身を持たないようにするため）。
      - name: Secrets Manager にトークンが入っているかを確認
        id: manager
        if: steps.awsrole.outputs.has == 'true'
        continue-on-error: true
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -uo pipefail
          for kind in figma-token backlog-api-key external-sources-token; do
            name="cortex/${GITHUB_REPOSITORY#*/}/${kind}"
            var="IN_MANAGER_$(echo "$kind" | tr 'a-z-' 'A-Z_')"
            if aws secretsmanager describe-secret --secret-id "$name" >/dev/null 2>&1; then
              echo "${var}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${var}=false" >> "$GITHUB_OUTPUT"
            fi
          done

      # 外部ソースのゲート実測（実際に読めているか）は**値**が要るのでここだけ取得する。
      # 失敗しても状況表示は止めない（gate: no_token として出るだけ）。
      - name: 外部ソース用トークンを取得
        id: ext_token
        continue-on-error: true
        uses: ./.cortex-engine/.github/actions/fetch-secret
        with:
          kind: external-sources-token
          fallback: ${{ secrets.EXTERNAL_SOURCES_TOKEN }}

      - name: セットアップ状況を生成
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # gh run list 用
          # Secrets Manager 側の有無（移行が済んだ案件は repo secret が無くても ok にする）
          IN_MANAGER_FIGMA_TOKEN: ${{ steps.manager.outputs.IN_MANAGER_FIGMA_TOKEN }}
          IN_MANAGER_BACKLOG_API_KEY: ${{ steps.manager.outputs.IN_MANAGER_BACKLOG_API_KEY }}
          IN_MANAGER_EXTERNAL_SOURCES_TOKEN: ${{ steps.manager.outputs.IN_MANAGER_EXTERNAL_SOURCES_TOKEN }}
          # シークレットの「有無」だけを渡す（値は渡さない・管理者権限も不要）
          HAS_AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}
          HAS_BACKLOG_API_KEY: ${{ secrets.BACKLOG_API_KEY != '' }}
          HAS_BACKLOG_DOMAIN: ${{ secrets.BACKLOG_DOMAIN != '' }}
          HAS_BACKLOG_PROJECT_KEY: ${{ secrets.BACKLOG_PROJECT_KEY != '' }}
          HAS_FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN != '' }}
          HAS_ENGINE_REPO_TOKEN: ${{ secrets.ENGINE_REPO_TOKEN != '' }}
          # **これを渡し忘れると、repo secret を持っている案件が「未設定」と表示される。**
          # 下の EXTERNAL_SOURCES_TOKEN は値（ゲート実測用）で、有無の判定には使えない
          # （Secrets Manager から取れた場合も値が入るため、供給元を区別できない）。
          HAS_EXTERNAL_SOURCES_TOKEN: ${{ secrets.EXTERNAL_SOURCES_TOKEN != '' }}
          # 外部ソース接続状況のゲート実測用（未設定の案件では gate: no_token になるだけで壊れない）
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          EXTERNAL_SOURCES_TOKEN: ${{ steps.ext_token.outputs.value }}
          # エンジンのバージョン（本ワークフローのコミットSHA）を報告に含める
          ENGINE_VERSION: ${{ github.job_workflow_sha }}
        run: node .cortex-engine/scripts/fleet-status.mjs

      - name: 変更があればコミット＆push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 新規ファイル（未追跡）も検知するため、先にstageしてから差分判定する
          git add fleet-status.json
          if git diff --staged --quiet; then
            echo "変更なし。スキップ"
            exit 0
          fi
          git commit -m "fleet-status: セットアップ状況を更新"

      - name: 堅牢push（未ステージ畳み込み・衝突自動解決・リトライ）
        uses: classmethod-team-app/cortex-engine/.github/actions/robust-push@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
