name: Gold昇格（Decision・用語集・メンバー・ルール）自動更新

# 案件リポのスタブから workflow_call で呼ばれる（トリガー・concurrency・permissions はスタブ側が持つ）
# 夜間Gold昇格の統合版。1セッションでソースを1回読み、決定・用語・メンバーdraft・ルールdraftを書く（決定抽出・用語登録の旧2ワークフローを1本に統合）
on:
  workflow_call:
    inputs:
      engine_ref:
        description: "エンジン（スクリプト等）のcheckout ref。スタブのチャンネルと揃える（stable=v1 / canary=main）"
        required: false
        type: string
        default: "v1"
      aws_role_arn:
        description: "Bedrock用IAMロールARN。別org等で secrets: inherit が届かない場合にスタブから明示的に渡す（空なら secrets.AWS_ROLE_TO_ASSUME を使う）"
        required: false
        type: string
        default: ""
      issue_key_filename:
        description: "Backlogミラーのファイル名を課題キーにする（長い日本語タイトルによるLinux 255バイト超を回避。案件でオプトイン）"
        required: false
        type: boolean
        default: false
      since:
        description: "増分起点をISO8601で上書き（バックフィル用。空なら前回成功以降）"
        required: false
        type: string
        default: ""
      gold_pipeline_mode:
        description: "Gold昇格の実装。real=パイプラインが書き、エージェントは動かさない（既定）/ shadow=エージェント(claude -p)が書き、パイプラインは観察のみ。問題が出た案件だけ shadow に戻せる"
        required: false
        type: string
        # 2026-07-30: カナリア（cortex-context）で 7/28・7/29 と実際に Decision・用語集・
        # メンバー名簿を起票できたため既定を real にし艦隊へ展開した。案件側スタブは本入力を
        # 渡していないので、既定値の変更だけで切り替わる（スタブの書き換えは不要）。
        # 問題が出た案件は、その案件のスタブに `gold_pipeline_mode: shadow` を足せば個別に戻せる。
        default: "real"

    secrets:
      # 別orgのスタブから呼ばれる場合 secrets: inherit は届かないため、受け口を明示的に宣言する。
      # 同一orgからの inherit も引き続き有効（後方互換）。未設定の案件では空文字で渡り、各ワークフローの前提チェックがskipに倒す。
      AWS_ROLE_TO_ASSUME:
        required: false
      BACKLOG_API_KEY:
        required: false
      BACKLOG_DOMAIN:
        required: false
      BACKLOG_PROJECT_KEY:
        required: false
      ENGINE_REPO_TOKEN:
        required: false
      EXTERNAL_SOURCES_TOKEN:
        required: false
      SLACK_BOT_TOKEN:
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 同一リポ内でmainへ書き込む同期系ワークフローと直列化し、push競合を構造的に減らす。
    concurrency:
      group: cortex-repo-write-${{ github.repository }}
      cancel-in-progress: false
    timeout-minutes: 60 # AI生成は通常15-20分。バックフィル等の大窓日は150ターン上限まで回るため60分に拡大（max-turnsとセットで管理する）
    env:
      AWS_REGION: ap-northeast-1 # Claude を有効化したリージョン（東京）

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 増分判定（git log --since）に履歴が必要

      - name: エンジンをチェックアウト（このワークフローと同一バージョン）
        uses: actions/checkout@v4
        with:
          repository: classmethod-team-app/cortex-engine
          ref: ${{ github.job_workflow_sha || inputs.engine_ref }}
          path: .cortex-engine
          # private エンジンの checkout には読み取りトークンが必要（org secret）。
          # エンジンが public/内部公開なら github.token でも通るためフォールバックする。
          token: ${{ secrets.ENGINE_REPO_TOKEN || github.token }}

      - name: エンジンをGit管理対象外にする
        run: echo ".cortex-engine/" >> .git/info/exclude

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # backlog-exporter@1 が node>=22 を要求

      # 案件のデータ版(schema_version)がエンジン最新より古い（未適用マイグレーション保留中）なら精製をスキップ
      - name: スキーマ版チェック
        id: schema
        run: |
          if node .cortex-engine/scripts/schema-current.mjs; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      # 必要なシークレットの有無を判定する。
      # - AWS_ROLE_TO_ASSUME 未設定（Bedrock未設定）なら Gold昇格自体をスキップ（セットアップ途中の案件で毎晩failしない）
      # - Backlog のシークレットが揃っていなければ Backlog同期だけスキップし、git差分（議事録等）からは更新する
      - name: 前提チェック（シークレットの有無）
        id: pre
        env:
          ROLE: ${{ inputs.aws_role_arn != '' && inputs.aws_role_arn || secrets.AWS_ROLE_TO_ASSUME }}
          BK_KEY: ${{ secrets.BACKLOG_API_KEY }}
          BK_DOM: ${{ secrets.BACKLOG_DOMAIN }}
          BK_PRJ: ${{ secrets.BACKLOG_PROJECT_KEY }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::notice::AWS_ROLE_TO_ASSUME 未設定（Bedrock未設定）。Gold昇格をスキップします。"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$BK_KEY" ] && [ -n "$BK_DOM" ] && [ -n "$BK_PRJ" ]; then
            echo "backlog=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Backlog シークレット未設定。Backlog同期をスキップし git差分からのみ更新します。"
            echo "backlog=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Backlog同期
        # このステップは差分ゲートを最新化するための補助であり、Goldの原料そのものは既にコミット済みの課題。
        # そのため docs/wiki の 403 等で backlog-exporter が部分失敗しても job を止めない（continue-on-error）。
        # ここでハード失敗させると、以降のGold昇格まで丸ごとskipされ「使っていないdocs/wikiの403で
        # Gold精製が毎晩止まる」事故になる。恒常的な同期失敗はスタンドアロンの sync-backlog が可視化する。
        continue-on-error: true
        if: steps.pre.outputs.run == 'true' && steps.pre.outputs.backlog == 'true'
        run: npx --yes backlog-exporter@1 update --force ${{ inputs.issue_key_filename && '--issueKeyFileName' || '' }}
        env:
          BACKLOG_API_KEY: ${{ secrets.BACKLOG_API_KEY }}
          DOMAIN: ${{ secrets.BACKLOG_DOMAIN }}
          PROJECT_KEY: ${{ secrets.BACKLOG_PROJECT_KEY }}

      # 増分の起点(SINCE)を「このワークフローの直近成功run」に置く。
      # 失敗runは成功扱いされないので、連続失敗しても次の成功実行で失敗分まで窓が自動で遡る（取りこぼしの巻き取り）。
      # 固定25h窓だと連続失敗で25hを超えた分が永久に漏れるため、その対策。
      # 注意: --workflow は案件リポ側スタブのファイル名。スタブは update-gold.yml の名前を変えないこと。
      - name: 増分窓の起点(SINCE)を算出（前回成功以降・14日キャップ）
        id: win
        if: steps.pre.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERRIDE_SINCE: ${{ inputs.since }}
        run: |
          CAP=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          if [ -n "$OVERRIDE_SINCE" ]; then
            SINCE="$OVERRIDE_SINCE"
            echo "::notice::SINCE を手動上書き（バックフィル）: $SINCE"
          else
            LAST=$(gh run list --workflow=update-gold.yml --status success --limit 1 --json createdAt --jq '.[0].createdAt // empty' 2>/dev/null || true)
            if [ -z "$LAST" ]; then SINCE="$CAP"; else SINCE="$LAST"; fi
            # 窓の下限（最低でも25時間は遡る）。日中に手動実行すると「直近の成功run」がその時刻まで進み、
            # その日の朝の投稿・更新が夜のrunの窓から外れて永久に取りこぼされる（実際に発生した）。
            # 重複は各フェーズの署名照合が吸収するので、遡りすぎによる二重起票は起きない。
            FLOOR=$(date -u -d '25 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            if [[ "$SINCE" > "$FLOOR" ]]; then SINCE="$FLOOR"; fi
          fi
          # 14日より古い起点は丸める（巨大窓によるmax-turns暴走を防ぐ。丸めた場合は未処理が残りうるので警告）
          if [[ "$SINCE" < "$CAP" ]]; then
            echo "::warning::増分起点 $SINCE が14日上限より古いため $CAP に丸めます（未処理分はsince入力で個別バックフィルを）"
            SINCE="$CAP"
          fi
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"
          echo "増分起点 SINCE=$SINCE"
          # 抽出に失敗したマスがあるとパイプラインは run を失敗させて次回に再処理させるが、恒常的に落ちる
          # ソースがあると毎晩赤くなり続けるため、連続失敗の回数で「諦める」判断をする。
          # 数えるのは **パイプラインのステップが失敗した run** だけ。run全体の赤（push衝突・Backlog同期の
          # 失敗など）を数えると、無関係な赤が続いた翌晩に一過性のエラーが出ただけで諦めてしまい、
          # 窓が前進して取りこぼしが確定する。
          CONSEC=0
          for ID in $(gh run list --workflow=update-gold.yml --limit 6 --json databaseId,conclusion \
                        --jq '.[] | select(.conclusion != null) | "\(.databaseId):\(.conclusion)"' 2>/dev/null); do
            case "${ID##*:}" in
              success) break ;;                 # 直近の成功に到達したら打ち切り
              failure) : ;;                      # 失敗のみ中身を確認する
              *) continue ;;                     # cancelled / timed_out 等はカウント対象外だが遡上は続ける
            esac
            STEP=$(gh run view "${ID%%:*}" --json jobs \
                     --jq '[.jobs[].steps[] | select(.name | test("Goldパイプライン")) | .conclusion] | first // ""' 2>/dev/null)
            if [ "$STEP" = "failure" ]; then CONSEC=$((CONSEC + 1)); else break; fi
          done
          echo "consecutive_failures=$CONSEC" >> "$GITHUB_OUTPUT"
          echo "パイプラインの連続失敗 CONSECUTIVE_FAILURES=$CONSEC"

      # ソース差分が無い夜はAI実行（Bedrock課金・Claudeインストール）を丸ごとスキップする。
      # 判定はスキルのステップ1と同一スクリプト（changed-sources.sh）で行い、二重定義を避ける。
      # ゲートはBacklog同期の後に置く（同期が持ち込む未コミット変更も検査対象に含めるため）。
      # 差分ゲート: リポ内差分(changed-sources.sh)に加えて、外部ソース(GitHub Issues/Discussions・Slack)の
      # 活動(external-sources.sh)も見る。対象は既定の自動導出(channels.json・.gitmodules)＋external-sources.jsonの
      # 明示登録を resolve-external-sources.mjs が解決する。
      # どちらかが非空なら changed=true（リポが静かでも外部に動きがあれば夜間精製を走らせる）。
      # 差分ゼロ最適化は「リポも外部も動きなし」の夜だけスキップ、を維持する。
      # external-sources.sh は権限エラー等を「活動なし」として扱うため、権限不備で毎晩空振りAI実行にはならない。
      - name: 差分ゲート（対象ソースが無ければAI実行をスキップ）
        id: gate
        if: steps.pre.outputs.run == 'true'
        env:
          SINCE: ${{ steps.win.outputs.since }}
          GH_TOKEN: ${{ secrets.EXTERNAL_SOURCES_TOKEN || secrets.GITHUB_TOKEN }}
          SELF_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 自リポのIssues/Discussionsは自動トークンで読む（外部ソース用PATの対象外でも取りこぼさない）
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }} # external-sources.sh が slack ソースを読むため（未設定なら slack は活動なし扱い）
        run: |
          CHANGED=$(bash .cortex-engine/plugin/scripts/changed-sources.sh "$SINCE" "Cortex/" "tmp/")
          EXT=$(bash .cortex-engine/plugin/scripts/external-sources.sh "$SINCE")
          if [ -n "$CHANGED" ] || [ -n "$EXT" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            if [ -n "$CHANGED" ]; then echo "対象ソース差分:"; echo "$CHANGED"; fi
            if [ -n "$EXT" ]; then echo "外部ソースに活動あり"; fi
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::前回成功以降の対象ソース差分・外部ソース活動なし。AI実行をスキップします。"
          fi

      - name: Git設定
        if: steps.pre.outputs.run == 'true' && steps.gate.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: AWS認証（OIDC）
        if: steps.pre.outputs.run == 'true' && steps.gate.outputs.changed == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # cortex-tools/infra の GithubActionsOidc が作成したロールARN
          role-to-assume: ${{ inputs.aws_role_arn != '' && inputs.aws_role_arn || secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Claude Code をインストール
        if: steps.pre.outputs.run == 'true' && steps.gate.outputs.changed == 'true'
        run: npm i -g @anthropic-ai/claude-code

      # シャドー比較用: 本番（claude -p）が起票したファイルを後段で git diff から機械取得するための基準コミット
      - name: シャドー比較用の基準コミットを記録
        id: goldprehead
        if: steps.pre.outputs.run == 'true' && steps.gate.outputs.changed == 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # real モードではパイプラインが書くので、エージェント側は動かさない（両方が書くと二重に起票される）。
      - name: Gold昇格自動更新（Claude / Bedrock）
        if: inputs.gold_pipeline_mode != 'real' && steps.pre.outputs.run == 'true' && steps.schema.outputs.current == 'true' && steps.gate.outputs.changed == 'true'
        env:
          CLAUDE_CODE_USE_BEDROCK: "1" # APIキーの代わりに Bedrock を使用
          ANTHROPIC_MODEL: global.anthropic.claude-sonnet-5 # Sonnet 5。jp.（日本国内推論）に未提供のため当面global.で運用し、jp.anthropic.claude-sonnet-5 が提供され次第そちらへ切り替える（Bedrockで該当モデルのアクセス有効化が必要）
          API_TIMEOUT_MS: "600000" # Bedrockの長いリクエスト（大コンテキスト読み）がCLI既定タイムアウトで「API Error: The operation timed out」死するのを防ぐ（2026-07-23に2連続発生）
          SINCE: ${{ steps.win.outputs.since }} # 増分起点（前回成功以降）。スキルの git log --since に渡す
          GH_TOKEN: ${{ secrets.EXTERNAL_SOURCES_TOKEN || secrets.GITHUB_TOKEN }}
          SELF_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 自リポのIssues/Discussionsは自動トークンで読む（外部ソース用PATの対象外でも取りこぼさない） # スキルが external-sources.sh で外部ソース(Issues/Discussions)を取得するため
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }} # スキルが external-sources.sh で slack ソースを取得するため（未設定なら slack はスキップ）
        run: |
          PROMPT=$(cat <<'EOF'
          .cortex-engine/plugin/skills/update-gold-auto/SKILL.md の指示に従い、
          前回実行以降に追加・更新されたコンテキスト（その日の議事録・課題等）から
          Gold層（Decisions・用語集・メンバーdraft・ルールdraft）への昇格を1セッションで行ってください。
          ソースは1回だけ読み、その読みを決定・用語・メンバー・ルールの各フェーズで共有してください。

          注意:
          - 増分方式です。フル走査せず、環境変数 SINCE 以降（前回成功以降）に追加・更新されたソースだけを対象にしてください。git log は --since="$SINCE" を使うこと（SINCEが空なら約25時間がデフォルト）。
          - Backlog同期は既にワークフロー側で実行済みなのでスキップしてください。
          - フェーズごと（決定→用語→メンバー→ルール）に、対象ディレクトリだけを git add して逐次コミットしてください（push は行わない）。
          - ルール（Rule）は用語より一段保守的に。継続的に守る制約として明示的に合意されたものだけを status: draft で起票し、一回の決定・単発TODO・推測は起票しないでください（確信が持てなければ起票しない）。
          - Cortex/ 配下・.cortex-engine/ 配下（エンジン）・tmp/ 配下（作業領域。下書きや検討中の案であり確定した事実ではない）は抽出源から除外してください（自己参照防止・エンジン不変更）。ただし本セッションの Phase A で自分が作成した Decision を用語フェーズの抽出源に含めるのは例外です（スキルの指示どおり）。
          - 昇格すべき候補が無ければコミット不要です（毎晩走るため、これは通常の状態です）。
          EOF
          )
          # 無人実行（ephemeralなCIランナー）のため権限確認はスキップする
          # 決定・用語・メンバー・ルールの4フェーズを1セッションで回すため、単発の60から余裕を見て増やす
          claude -p "$PROMPT" --max-turns 150 --dangerously-skip-permissions

      # 決定的パイプライン＋LLM関数化の実装。
      #   shadow … エージェント(claude -p)の後に「観察だけ」実行する。リポジトリの変更・コミット・pushはしない
      #            （起票するはずだった生成物をrun log / Step Summaryに出すのみ）。エージェントの後に置くことで、
      #            同一runの中で「エージェントが実際に起票したもの」（GOLD_PRE_HEAD..HEADのgit diff）と突き合わせられる。
      #            観察なので失敗してもrunを落とさない（continue-on-error）。
      #   real   … パイプラインが書いてフェーズごとにコミットする（エージェントは動かさない）。pushは後段の共通ステップ。
      #            抽出に失敗したマスがあると非0で終了し、runを失敗させて翌日の窓で再処理させる。
      #            この持ち越しが機能するよう continue-on-error を外す。
      # Push より前に置くこと（real でパイプラインが作ったコミットを push させるため）。
      - name: Goldパイプライン
        if: steps.pre.outputs.run == 'true' && steps.schema.outputs.current == 'true' && steps.gate.outputs.changed == 'true'
        continue-on-error: ${{ inputs.gold_pipeline_mode != 'real' }}
        # shadow は観察用なので打ち切ってよい（大窓の夜にジョブ残時間を食い潰してrunごとcancelledにしない）。
        # real は本体なので、エージェントに割り当てていた時間を引き継ぐ。
        timeout-minutes: ${{ inputs.gold_pipeline_mode == 'real' && 45 || 15 }}
        env:
          GOLD_PIPELINE_MODE: ${{ inputs.gold_pipeline_mode }}
          CONSECUTIVE_FAILURES: ${{ steps.win.outputs.consecutive_failures }} # 抽出失敗を諦める判断に使う（REALで有効。shadowは報告のみ）
          ANTHROPIC_MODEL: global.anthropic.claude-sonnet-5 # 本番ステップと同一モデル
          SINCE: ${{ steps.win.outputs.since }} # 本番と同じ増分起点
          GOLD_PRE_HEAD: ${{ steps.goldprehead.outputs.sha }} # 本番の起票分を比較表示するための基準
          GH_TOKEN: ${{ secrets.EXTERNAL_SOURCES_TOKEN || secrets.GITHUB_TOKEN }}
          SELF_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 自リポのIssues/Discussionsは自動トークンで読む（外部ソース用PATの対象外でも取りこぼさない） # external-sources.sh 用（本番と同一）
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }} # external-sources.sh の slack ソース用（未設定なら活動なし扱い）
        run: node .cortex-engine/plugin/scripts/update-gold-pipeline.mjs

      # 生成物がオントロジー規約に違反している場合、ここで止める（壊れたコミットをpushしない）
      # 増分窓が約25時間あるため、生成の揺らぎによる違反は翌晩のリトライで回復する
      # always() で、精製ステップが打ち切られた場合も検証する（下の Push が検証結果に依存するため）。
      - name: Cortexのスキーマ検証
        id: validate
        if: always() && steps.pre.outputs.run == 'true' && steps.gate.outputs.changed == 'true'
        run: node .cortex-engine/plugin/scripts/validate-cortex.mjs

      # 精製ステップが打ち切られても、そこまでにコミットされた分は push する（条件付きにすると
      # その成果ごと捨てられる。議事録生成で実際に全損した経路と同じ）。
      #
      # ただし **`always()` だけにしてはいけない**。`always()` は暗黙の success() を落とすため、
      # 直前の検証が exit 1 で落ちた場合も push してしまう。それは検証ゲートの撤去に等しく、
      # 次の状態に固定される: 規約外のレコードが main に永住 → 毎晩の検証が落ち続ける →
      # SINCE は「直近**成功**run」から算出するので成功runが生まれず窓が前進しない → 14日
      # キャップに張り付いて毎晩14日ぶんを再処理する。人がファイルを直すまで自動回復しない。
      # よって `steps.validate.outcome == 'success'` を必ず併記する。
      #
      # 増分窓(SINCE)は打ち切られたrun（conclusion=cancelled）では進まないため、次回が同じ窓を
      # 見直す。同じソースを再度掘っても、先にpushしたレコードが「既存」として重複照合に掛かる。
      # ただし照合は正規化titleの完全一致なので、言い換えが起きると別レコードになり得る（残存リスク）。
      #
      # 既知の限界: real モードは全ソースの抽出を終えてから applyReal() で一括コミットするため、
      # 抽出中に打ち切られると救出できる成果がない。real 移行時にソースごとの適用へ直す必要がある。
      - name: Push（競合時はrebaseで再試行）
        if: always() && steps.validate.outcome == 'success' && steps.pre.outputs.run == 'true' && steps.gate.outputs.changed == 'true'
        uses: classmethod-team-app/cortex-engine/.github/actions/robust-push@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
