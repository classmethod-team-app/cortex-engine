name: Backlog同期

# 案件リポのスタブから workflow_call で呼ばれる（トリガー・concurrency・permissions はスタブ側が持つ）
on:
  workflow_call:
    inputs:
      engine_ref:
        description: "エンジンのcheckout ref。スタブのチャンネルと揃える（stable=v1 / canary=main）"
        required: false
        type: string
        default: "v1"
      issue_key_filename:
        description: "Backlogミラーのファイル名を課題キーにする（長い日本語タイトルによるLinux 255バイト超を回避。案件でオプトイン）"
        required: false
        type: boolean
        default: false

    secrets:
      # 別orgのスタブから呼ばれる場合 secrets: inherit は届かないため、受け口を明示的に宣言する。
      # 同一orgからの inherit も引き続き有効（後方互換）。未設定の案件では空文字で渡り、各ワークフローの前提チェックがskipに倒す。
      BACKLOG_API_KEY:
        required: false
      # 設定UIから投入されたキーを Secrets Manager から取るために使う。
      # 未設定の案件は従来どおり repo secret にフォールバックする。
      AWS_ROLE_TO_ASSUME:
        required: false
      BACKLOG_DOMAIN:
        required: false
      BACKLOG_PROJECT_KEY:
        required: false
      # エンジン（fetch-secret アクション）を取ってくるために使う。未設定なら github.token。
      ENGINE_REPO_TOKEN:
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # permissions はここで宣言しない。呼び出し元より広い権限を要求すると run ごと
    # startup_failure になる（権限は連鎖の中で減らせても増やせない）。艦隊の型に合わせ、
    # 呼び出し元スタブが `id-token: write` を宣言し、ここは継承する。
    # 同一リポ内でBacklogミラーへ書き込む全ワークフロー（cron同期・realtime・decision-log等）を
    # 1グループに直列化し、backlog-settings.json 等の再生成ファイルでのpush競合を構造的に減らす。
    concurrency:
      group: cortex-repo-write-${{ github.repository }}
      cancel-in-progress: false
    # ジッター最大10分 + 同期 + リトライを考慮して引き上げ
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # fetch-secret アクションを使うため。`uses:` は式を書けないので、
      # このワークフローと同一バージョンのエンジンを取ってきてローカル参照する
      # （`@v1` の固定参照だと、カナリア（@main）で版がずれる）。
      - name: エンジンをチェックアウト（このワークフローと同一バージョン）
        uses: actions/checkout@v4
        with:
          repository: classmethod-team-app/cortex-engine
          ref: ${{ job.workflow_sha || inputs.engine_ref }}
          path: .cortex-engine
          token: ${{ secrets.ENGINE_REPO_TOKEN || github.token }}

      - name: エンジンをGit管理対象外にする
        run: echo ".cortex-engine/" >> .git/info/exclude

      # チェックアウトしたエンジンに、このワークフローが使うアクションが在るかを確かめる。
      # スタブの `uses: ...@<channel>` と `engine_ref` が揃っていないと**別の版**が落ちてきて、
      # `uses: ./…` がアクションを見つけられずジョブ全体が落ちる（実際にカナリアで起きた）。
      # ここで気づけるようにし、落とさずに従来の repo secret へ退避する。
      - name: エンジンの版が揃っているか確認
        id: engineok
        run: |
          if [ -f .cortex-engine/.github/actions/fetch-secret/action.yml ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::warning::チェックアウトしたエンジンに fetch-secret がありません。スタブの engine_ref が uses: のチャンネルと揃っているか確認してください。従来の repo secret で続行します"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # backlog-exporter@1 が node>=22 を要求

      - name: ジッター待機（同時刻バースト回避）
        if: github.event_name == 'schedule'
        run: |
          # BACKLOG_API_KEY を中央化（org secret）すると、同一Backlogスペースに同居する
          # 複数案件が同じキーで毎時:00に同時発火し、スペースのレート上限に同時に当たりうる。
          # 0〜600秒のrandom待機でバーストを分散する。手動実行(workflow_dispatch)では待たない。
          wait=$((RANDOM % 601))
          echo "同時刻バースト回避のため ${wait} 秒待機します"
          sleep "$wait"

      # `secrets` は if: で直接参照できないので、一度 env に落としてから判定する。
      - name: AWSロールの有無を判定
        id: awsrole
        env:
          ROLE: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          if [ -n "${ROLE:-}" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi

      # 認証に失敗しても同期は止めない。フォールバック（repo secret）に落ちるだけにする。
      - name: AWS認証（Secrets Manager からキーを取るため。未設定ならスキップ）
        id: awsauth
        if: steps.awsrole.outputs.has == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-northeast-1

      # 認証が壊れたときに黙ってフォールバックへ落ちると、「読めない」が「未設定」に丸まる。
      - name: AWS認証の失敗を記録（続行はする）
        if: steps.awsauth.outcome == 'failure'
        run: echo "::warning::AWS認証に失敗しました。従来の repo secret で続行します（設定UIから投入した値は効きません）"

      - name: BacklogのAPIキーを取得
        if: steps.engineok.outputs.has == 'true'
        id: backlog_key
        uses: ./.cortex-engine/.github/actions/fetch-secret
        with:
          kind: backlog-api-key
          fallback: ${{ secrets.BACKLOG_API_KEY }}

      - name: Backlog同期
        id: sync
        env:
          BACKLOG_API_KEY: ${{ steps.backlog_key.outputs.value || secrets.BACKLOG_API_KEY }}
          DOMAIN: ${{ secrets.BACKLOG_DOMAIN }}
          PROJECT_KEY: ${{ secrets.BACKLOG_PROJECT_KEY }}
        run: |
          # 初回（backlog-settings.json が無い新規リポ）は全量取得 all、以降は増分 update。
          #   update は既存の backlog-settings.json（lastUpdated）を前提にするため、
          #   初回にこれが無いと「変更なし」で何も入らない（新規セットアップの落とし穴）。
          # all/update とも冪等なので、下のリトライで再実行しても安全。
          run_sync() {
            if find . -name backlog-settings.json -not -path './.git/*' | grep -q .; then
              npx --yes backlog-exporter@1 update --force ${{ inputs.issue_key_filename && '--issueKeyFileName' || '' }}
            else
              echo "backlog-settings.json が無いため初回全量取得(all)を実行します"
              npx --yes backlog-exporter@1 all --domain "$DOMAIN" --projectIdOrKey "$PROJECT_KEY" --output ./課題管理
            fi
          }
          # backlog-exporter自身も100req/15秒のRateLimiterを持つが、
          # 課題一覧fetchの失敗は致命的(即終了)になるため、ジョブ全体の軽いリトライを保険として被せる。
          for attempt in 1 2 3; do
            if run_sync; then
              # Backlog上で削除・移動された課題・ドキュメント・Wikiのローカル残骸を掃除してミラーを一致させる。
              # 一覧取得に失敗した場合は何も削除しない安全設計のため、失敗しても同期全体は失敗させない（ログのみ）。
              npx --yes backlog-exporter@1 prune --force || echo "::warning::pruneに失敗（同期は成功扱い。次回に再試行）"
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "同期に失敗しました（試行 ${attempt}/3）。${attempt}分待って再試行します..." >&2
            sleep $((attempt * 60))
          done
          # 3回失敗しても、ここで job を止めない。exporter は課題→Wiki→ドキュメントの順に
          # 逐次ディスクへ書くため、途中の 403 等で落ちても「取得済み分」は working tree に残っている。
          # それを次ステップで commit/push し、取得済みの成果を捨てないようにする（未取得分は
          # 該当フォルダの lastUpdated が未前進のため次回 update で再取得＝自己回復）。
          # prune は部分同期での誤削除を避けるためスキップ（成功時のみ実行済み）。最終ステップで run を失敗にする。
          echo "::warning::Backlog同期が3回失敗（403等で一部リソース未取得）。取得済み分だけコミットして続行します" >&2
          echo "ok=false" >> "$GITHUB_OUTPUT"

      # 同期の取りこぼしを、コミットの前に拾い直す。
      #
      # exporter はドキュメントをツリーAPIだけから取得し、取得できたかに関わらず
      # 差分カーソルを「実行時刻」まで進める。そのためツリーAPIに一時的に載らなかった
      # ドキュメントは、あとで載っても「もう見た」と判定されて**永久に入らない**
      # （実際に1件失われ、顧客側メンバーの指摘で発覚した。同期は6回とも緑だった）。
      #
      # 一覧API（ツリーに依存しない）を正として突き合わせ、欠けを取り直す。
      # ここで拾えた分は下のコミットに含まれる。
      # 版がずれたエンジンを引いた場合はスクリプトが無い。落とさずに飛ばす（既存の型に合わせる）。
      # 突き合わせ自体の失敗はスクリプト内で握りつぶしている。**ここで continue-on-error を
      # 付けない** — 付けると「24時間以上入っていない」という意図した失敗まで消える。
      - name: ドキュメントの取りこぼしを検出・回収
        if: ${{ !cancelled() && steps.engineok.outputs.has == 'true' }}
        env:
          BACKLOG_API_KEY: ${{ steps.backlog_key.outputs.value || secrets.BACKLOG_API_KEY }}
          BACKLOG_DOMAIN: ${{ secrets.BACKLOG_DOMAIN }}
          BACKLOG_PROJECT_KEY: ${{ secrets.BACKLOG_PROJECT_KEY }}
        run: node .cortex-engine/scripts/backlog-document-audit.mjs

      - name: 変更をコミット・プッシュ
        if: ${{ !cancelled() }} # 同期が途中失敗しても取得済み分はコミットする
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 同期ミラーのルート（backlog-settings.json を持つディレクトリ）をステージする。
          # ディレクトリ名は案件でカスタマイズされ得る（例: 課題管理/ ではなく Backlog/）ためハードコードしない。
          for d in $(find . -name backlog-settings.json -not -path './node_modules/*' -not -path './.git/*' | xargs -n1 dirname | sort -u); do
            git add "$d"
          done
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "Backlogデータを同期"

      - name: 堅牢push（未ステージ畳み込み・衝突自動解決・リトライ）
        if: ${{ !cancelled() }} # 取得済み分は途中失敗でも push する
        uses: classmethod-team-app/cortex-engine/.github/actions/robust-push@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 同期が途中失敗なら run を失敗にする（取得済み分は push 済み）
        if: steps.sync.outputs.ok != 'true'
        run: |
          echo "::error::Backlog同期が途中で失敗しました。取得済み分はコミット/push済みですが、一部リソース（403等）が未取得です。次回の同期で再取得を試みます。恒常的に続く場合は APIキーの権限（そのユーザーが該当ドキュメント/Wikiを閲覧できるか）と backlog-exporter の 403 ハンドリングを確認してください。"
          exit 1
