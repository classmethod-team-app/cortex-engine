name: CI

# エンジン自身のテスト。案件リポからは呼ばれない（workflow_call を持たない）。
# PRを立てる前のブランチでも走らせる（PR時だけだと、押した変更が初めて検証されるのが遅い）
on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
