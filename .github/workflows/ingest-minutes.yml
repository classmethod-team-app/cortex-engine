name: 議事録 自動生成（文字起こし→議事録）

# 案件リポのスタブから workflow_call で呼ばれる。
# cortex-notetaker(Apps Script) が文字起こしを追加すると案件リポへ repository_dispatch → スタブが本ワークフローを呼ぶ。
on:
  workflow_call:
    inputs:
      engine_ref:
        description: "エンジン（スクリプト等）のcheckout ref。スタブのチャンネルと揃える（stable=v1 / canary=main）"
        required: false
        type: string
        default: "v1"
      aws_role_arn:
        description: "Bedrock用IAMロールARN。別org等で secrets: inherit が届かない場合にスタブから明示的に渡す（空なら secrets.AWS_ROLE_TO_ASSUME を使う）"
        required: false
        type: string
        default: ""
    secrets:
      # 別orgのスタブから呼ばれる場合 secrets: inherit は届かないため、受け口を明示的に宣言する。
      # 同一orgからの inherit も引き続き有効（後方互換）。未設定の案件では空文字で渡り、各ワークフローの前提チェックがskipに倒す。
      AWS_ROLE_TO_ASSUME:
        required: false
      ENGINE_REPO_TOKEN:
        required: false
      SLACK_BOT_TOKEN:
        required: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # 同一リポ内でmainへ書き込む同期系ワークフローと直列化し、push競合を構造的に減らす。
    concurrency:
      group: cortex-repo-write-${{ github.repository }}
      cancel-in-progress: false
    # 25分から延ばさないこと。この group（cortex-repo-write）には書き込み系が全て入っており、
    # cron は 12:00 ingest → 12:45 sync-designs → 13:00 update-gold（UTC）と詰まっている。
    # 45分にすると ingest が 12:45 まで枠を占有し、pending に回った sync-designs が
    # 13:00 の update-gold の登録で**警告も出さずキャンセルされる**（同一グループの pending は
    # 1本しか保持されない）。滞留の消化は1回で終わらせるのではなく、Push を always() にして
    # 1回ごとに前進させることで解く。
    timeout-minutes: 25
    env:
      AWS_REGION: ap-northeast-1 # Claude を有効化したリージョン（東京）

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 既存議事録の有無の照合に履歴が必要

      - name: エンジンをチェックアウト（このワークフローと同一バージョン）
        uses: actions/checkout@v4
        with:
          repository: classmethod-team-app/cortex-engine
          ref: ${{ job.workflow_sha || inputs.engine_ref }}
          path: .cortex-engine
          token: ${{ secrets.ENGINE_REPO_TOKEN || github.token }}

      - name: エンジンをGit管理対象外にする
        run: echo ".cortex-engine/" >> .git/info/exclude

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 案件のデータ版(schema_version)がエンジン最新より古い（未適用マイグレーション保留中）なら精製をスキップ
      - name: スキーマ版チェック
        id: schema
        run: |
          if node .cortex-engine/scripts/schema-current.mjs; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      # AWS_ROLE_TO_ASSUME 未設定（Bedrock未設定）なら丸ごとスキップ（セットアップ途中の案件で毎晩failしない）
      - name: 前提チェック（Bedrockロールの有無）
        id: pre
        env:
          ROLE: ${{ inputs.aws_role_arn != '' && inputs.aws_role_arn || secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::notice::AWS_ROLE_TO_ASSUME 未設定（Bedrock未設定）。議事録自動生成をスキップします。"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Git設定
        if: steps.pre.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 通知（後段）で「このrunで増えた議事録」を検出するための基準コミットを記録
      - name: 通知用の基準コミットを記録
        id: prehead
        if: steps.pre.outputs.run == 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: AWS認証（OIDC）
        if: steps.pre.outputs.run == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # cortex-tools/infra の GithubActionsOidc が作成したロールARN
          role-to-assume: ${{ inputs.aws_role_arn != '' && inputs.aws_role_arn || secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Claude Code をインストール
        if: steps.pre.outputs.run == 'true'
        run: npm i -g @anthropic-ai/claude-code

      - name: 議事録 自動生成（Claude / Bedrock）
        if: steps.pre.outputs.run == 'true' && steps.schema.outputs.current == 'true'
        env:
          CLAUDE_CODE_USE_BEDROCK: "1" # APIキーの代わりに Bedrock を使用
          ANTHROPIC_MODEL: global.anthropic.claude-sonnet-5 # Sonnet 5。jp.（日本国内推論）に未提供のため当面global.で運用し、jp.anthropic.claude-sonnet-5 が提供され次第そちらへ切り替える（Bedrockで該当モデルのアクセス有効化が必要）
        run: |
          PROMPT=$(cat <<'EOF'
          会議ディレクトリ（`ingest-config.json` があるディレクトリ。通常は 会議/ だが案件により MTG/ 等にカスタマイズされている）配下には、
          cortex-notetaker により自動取り込みされた会議の「文字起こし」が置かれています。
          まだ議事録が作られていない文字起こしを見つけ、議事録を生成してください。

          手順:
          - 会議ディレクトリ配下を走査し、文字起こしファイルのうち「対応する議事録がまだ無いもの」だけを対象にする。
            （同じ会議・日付の議事録が既にあるものはスキップ。毎晩走るため、未処理が無ければ通常状態です）
          - 各対象について、.cortex-engine/plugin/skills/create-minute/SKILL.md の様式に従って議事録を生成する。
            生成して終わりにせず、SKILL.md の「生成後の自己検証（第2パス）」セクションまで必ず実施する（課題キー実在・担当者の名簿突合・日付×曜日・ステータス規律・文字起こし突合。疑わしい箇所は自動修正せず ⚠️要確認 を付ける）。
          - 議事録に frontmatter は付けない（frontmatter は Gold 層 = Cortex/ 配下のみ）。代わりに、自動生成・
            人間レビュー前であることを示す一行「> ⚠️ この議事録はAIによる自動生成です（人間レビュー前）。内容を
            確認したらこの行を削除してください。」を本文の H1 直後に入れる（Human on the loop。人が確認したら
            その行を削除する運用）。
          - 文字起こし原本（Bronze）の中身は改変しない。ただし議事録と文字起こしは必ず同じフォルダに同居させること。
            既存の会議ディレクトリの階層構成（例: 会議/{フェーズ}/{定例名}/{YYYYMMDD}/ に議事録・文字起こし・元ファイルが同居）を確認し、
            投入フォームやbotがフラットな場所（例: 会議/{YYYYMMDD}-xxx.docx）に置いた文字起こし原本は、生成する議事録と同じ
            {YYYYMMDD}フォルダへ移動してから議事録を作る（create-minute/SKILL.md の配置規約に従う）。日付プレフィックスは除いてよい。
          - .cortex-engine/ 配下（エンジン）は走査対象から除外し、変更・コミットもしない。
          - **1件終わるたびに git commit する**（push は行わない）。最後にまとめてコミットしない。
            1コミットは「文字起こしの移動＋その議事録」で完結させ、第2パスの自己検証まで済ませてから
            コミットする（検証前のものをコミットすると、次回は「議事録あり」と見なされ二度と検証されない）。
            滞留が多いとタイムアウトで打ち切られることがあり、**コミット済みの分だけが救出される**ため、
            まとめてコミットするとその回の成果が全て失われる。
          - 対象が無ければ何もコミットせず終了する。
          EOF
          )
          # 無人実行（ephemeralなCIランナー）のため権限確認はスキップする。
          #
          # --output-format json で使用量を取る。議事録生成はエージェント（claude -p）が残る唯一の
          # 経路で、Goldパイプラインと違って自己申告が無く**コストが測れなかった**ため。
          # CloudWatchのBedrockメトリクスは案件横断で混ざる（夜間は9案件が同時に走る）ので、
          # run単位で切り分けるにはツール自身の申告が必要。
          #
          # 副作用として stdout が最終JSONだけになり実行中のログが見えなくなるので、後段で
          # result本文を必ず出す。抽出が失敗しても生JSONを出して観測性を落とさない。
          set +e
          claude -p "$PROMPT" --max-turns 60 --dangerously-skip-permissions \
            --output-format json > /tmp/claude-result.json
          CLAUDE_EXIT=$?
          set -e

          # result本文と使用量を出す（Goldパイプラインの「LLM使用量:」と同じ書式で揃える）。
          # ここで job を落とさない（|| true）。落とすのは claude 本体の終了コードだけ。
          node -e '
            const fs = require("fs");
            let j;
            try { j = JSON.parse(fs.readFileSync("/tmp/claude-result.json", "utf8")); }
            catch { process.exit(9); }
            if (j.result) console.log(String(j.result));
            const u = j.usage || {};
            const inp = u.input_tokens || 0, out = u.output_tokens || 0;
            const cw = u.cache_creation_input_tokens || 0, cr = u.cache_read_input_tokens || 0;
            const billed = inp + cw + cr;
            const saved = billed > 0 ? Math.round((cr / billed) * 100) : 0;
            console.log(
              `LLM使用量: ${j.num_turns ?? "?"}ターン / 入力 ${inp} / 出力 ${out} / ` +
              `キャッシュ書込 ${cw} / キャッシュ読込 ${cr}（入力側の${saved}%がキャッシュ読込）` +
              (j.total_cost_usd != null ? ` / 申告コスト $${j.total_cost_usd}` : "")
            );
          ' || { echo "::warning::usageの抽出に失敗しました。生の出力を出します。"; cat /tmp/claude-result.json || true; }

          exit "$CLAUDE_EXIT"

      # always()（＝生成ステップがタイムアウト・失敗しても実行する）。
      # 生成ステップは1件終わるごとに commit する（上のプロンプトで指示）ので、打ち切られた
      # 時点までの成果はローカルに残っている。ここを条件付きにすると**その成果ごと捨てられる**
      # （実測: 滞留8件のリポで25分で打ち切られ Push が skip され、生成済みの議事録が全損した）。
      # 部分 push で壊れる心配はない——1コミット = 文字起こしの移動＋その議事録で完結しており、
      # 少なく入るだけ。残りは次回（repository_dispatch / 日次cron / 手動再実行）が拾う。
      #
      # 前提: 救出はキャンセル後の猶予（数分）の中で終わる必要がある。push は通常数秒だが、
      # rebase リトライに入ると猶予を超えて強制終了され救出できないことがある。
      - name: Push（競合時はrebaseで再試行）
        if: always() && steps.pre.outputs.run == 'true'
        uses: classmethod-team-app/cortex-engine/.github/actions/robust-push@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 生成された議事録を Slack に通知しレビューを促す（品質ゲート。best-effort＝失敗しても job を落とさない）。
      # notify:true チャンネルへ投稿し、文字起こしに埋め込まれた organizer をメンションする。
      #
      # Push と同じく always()。打ち切られたrunで push だけ走って通知が skip されると、
      # その議事録は**永久に通知されない**（次回は「議事録あり」と見なしてスキップするため
      # 二度目の機会が来ない）。未レビューのまま Gold 昇格に食われるのを防ぐ。
      - name: 議事録レビュー依頼を通知（best-effort）
        if: always() && steps.pre.outputs.run == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          PRE_HEAD: ${{ steps.prehead.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          [ -n "$PRE_HEAD" ] || exit 0
          # このrunで増えた議事録ファイルを検出（0件なら何もしない）
          NEW_MINUTES=$(git -c core.quotepath=false diff --name-only "$PRE_HEAD"..HEAD | grep '_minutes\.md$' || true)
          [ -n "$NEW_MINUTES" ] || { echo "::notice::新規議事録なし。通知しません。"; exit 0; }
          # 議事録の指定セクション（見出し文言は create-minute のテンプレートが正）の本文を取り出す。
          # 見出し行の次から、次の "## " 見出し or EOF までを返す。
          extract_section() {
            awk -v h="$2" '
              $0 ~ "^## " h "[[:space:]]*$" {cap=1; next}
              cap && /^## / {cap=0}
              cap {print}
            ' "$1"
          }
          # 1ファイル=1通のループ（主催者はファイルごとに異なりうるため）。通知は best-effort。
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            dir=$(dirname "$f")
            # 表示名: ディレクトリ2段（定例名/日付）を人間可読に
            label=$(printf '%s' "$dir" | awk -F/ '{ if (NF>=2) print $(NF-1)" "$NF; else print $NF }')
            # GitHubリンク（パスをURLエンコード）
            enc=$(python3 -c 'import sys,urllib.parse; print("/".join(urllib.parse.quote(p) for p in sys.argv[1].split("/")))' "$f")
            link="https://github.com/${REPO}/blob/main/${enc}"
            # 主催者メール: 同じディレクトリ内のファイルから最初の organizer を拾う
            email=$(grep -rhoE 'cortex: organizer=[^ >-]+' "$dir" 2>/dev/null | head -n1 | sed 's/^cortex: organizer=//' || true)
            # ingest-config.json の notifyMention が設定されていれば主催者より優先（固定の宛先に上書き）
            cfg=$(find . -maxdepth 3 -name ingest-config.json -not -path './.cortex-engine/*' -not -path './.git/*' 2>/dev/null | head -1)
            if [ -n "$cfg" ]; then
              override=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("notifyMention") or "")' "$cfg" 2>/dev/null || true)
              [ -z "$override" ] || email="$override"
            fi
            # リンクは mrkdwn の埋め込み形式 <URL|テキスト>（生URLが長くてチャンネルの表示を折るため）
            body=$(printf '📝 議事録が自動生成されました\n%s → <%s|議事録を開く>\n今晩のGold昇格前に内容の確認をお願いします（冒頭の⚠️行を削除するとレビュー済みの印になります）。' "$label" "$link")
            # 「決定事項まとめ」「TODOアイテム」の本文をスレッド返信として組み立てる（空行は除く）。
            # どちらも空なら従来どおり親通知のみ（チャンネルを要点で埋めない）。
            dec=$(extract_section "$f" "決定事項まとめ" | sed '/^[[:space:]]*$/d')
            todo=$(extract_section "$f" "TODOアイテム" | sed '/^[[:space:]]*$/d')
            tf=$(mktemp)
            if [ -n "$dec" ]; then { echo "*決定事項*"; echo "$dec"; } >> "$tf"; fi
            if [ -n "$todo" ]; then if [ -s "$tf" ]; then echo "" >> "$tf"; fi; { echo "*TODO*"; echo "$todo"; } >> "$tf"; fi
            # notify-slack.sh の引数を組み立てる（メンション解決・スレッド化はいずれも best-effort）。
            NS_ARGS=()
            if [ -n "$email" ]; then NS_ARGS+=(--mention-email "$email"); fi
            if [ -s "$tf" ]; then NS_ARGS+=(--thread-file "$tf"); fi
            printf '%s' "$body" | bash .cortex-engine/plugin/scripts/notify-slack.sh "${NS_ARGS[@]}" || true
            rm -f "$tf"
          done <<< "$NEW_MINUTES"

      # 【シャドー実行は撤去した（2026-07-30）】決定的パイプライン（plugin/scripts/ingest-minutes-pipeline.mjs）
      # を毎晩「観察だけ」走らせていたが、次の2点で費用だけ払う状態になっていたため外した。
      # スクリプト自体は REAL 移行の土台として残してある（再開するなら下の条件を満たしてから）。
      #
      #   1. **比較結果が残らない**: shadow は無変更要件のため /tmp と $GITHUB_STEP_SUMMARY にしか
      #      書かない。runに紐づいて消えるので蓄積されず、突き合わせが実際には行われていなかった。
      #   2. **本番の時間を奪っていた**: 本番(claude -p)より前に置かれていたため、滞留8件のリポで
      #      25分中16分を消費し、本番に9分弱しか残らず議事録が1件も作れなかった（実測）。
      #
      # 再開するときの条件: (a) レポートを蓄積できる場所へ出す（tmp/ にコミットする等）。
      # (b) 本番と Push の**後ろ**に置き timeout-minutes で上限を切る。時間予算は成果を残す処理が先に取る。
