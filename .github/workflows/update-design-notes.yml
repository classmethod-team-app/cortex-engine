name: デザインMD自動育成（廃止済み）

# **このワークフローは廃止された。中身は空で、何もせずに正常終了する。**
#
# DESIGN.md はデザインハーネスの design-md が育てる成果物になり、Cortex は同期も育成もしなくなった
# （sync-designs のトークン生成も撤去済み）。育成の根拠にしていたサムネイル（デザイン/resources/）も
# 取らなくなったので、走らせても根拠が無いまま本文を書き換えに行くだけで、Bedrock 課金だけがかかる。
#
# **ファイルを今すぐ消せない理由**: 案件スタブが `uses: ...@v1` で参照している。先に消すと、
# スタブが残っている案件で run が startup_failure になる。スタブの削除は migration 0034
# で行い、全案件から参照が消えたことを確認してからこのファイルを削除する。
# それまでの間、中身を空にして無害化しておく。
on:
  workflow_call:
    inputs:
      engine_ref:
        description: "エンジン（スクリプト等）のcheckout ref。スタブのチャンネルと揃える（stable=v1 / canary=main）"
        required: false
        type: string
        default: "v1"
      aws_role_arn:
        description: "Bedrock用IAMロールARN。別org等で secrets: inherit が届かない場合にスタブから明示的に渡す（空なら secrets.AWS_ROLE_TO_ASSUME を使う）"
        required: false
        type: string
        default: ""
      since:
        description: "増分起点をISO8601で上書き（バックフィル用。空なら前回成功以降）"
        required: false
        type: string
        default: ""

    secrets:
      # 別orgのスタブから呼ばれる場合 secrets: inherit は届かないため、受け口を明示的に宣言する。
      # 同一orgからの inherit も引き続き有効（後方互換）。未設定の案件では空文字で渡り、各ワークフローの前提チェックがskipに倒す。
      AWS_ROLE_TO_ASSUME:
        required: false
      ENGINE_REPO_TOKEN:
        required: false

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: 廃止済みであることを知らせる
        run: |
          echo "::notice::デザインMD自動育成は廃止されました。DESIGN.md はデザインハーネスの design-md で育てます"
          echo "このワークフローのスタブ（.github/workflows/update-design-notes.yml）は migration 0034 で削除されます"
