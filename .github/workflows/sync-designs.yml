name: デザイン同期

# 案件リポのスタブから workflow_call で呼ばれる（トリガー・concurrency・permissions はスタブ側が持つ）
on:
  workflow_call:
    inputs:
      engine_ref:
        description: "エンジン（スクリプト等）のcheckout ref。スタブのチャンネルと揃える（stable=v1 / canary=main）"
        required: false
        type: string
        default: "v1"
    secrets:
      # 別orgのスタブから呼ばれる場合 secrets: inherit は届かないため、受け口を明示的に宣言する。
      # 同一orgからの inherit も引き続き有効（後方互換）。未設定の案件では空文字で渡り、各ワークフローの前提チェックがskipに倒す。
      ENGINE_REPO_TOKEN:
        required: false
      FIGMA_TOKEN:
        required: false
      # 設定UIから投入されたトークンを Secrets Manager から取るために使う。
      # 未設定の案件は従来どおり repo secret の FIGMA_TOKEN にフォールバックする。
      AWS_ROLE_TO_ASSUME:
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # permissions はここで宣言しない。呼び出し元より広い権限を要求すると run ごと
    # startup_failure になる（権限は連鎖の中で減らせても増やせない）。艦隊の型に合わせ、
    # 呼び出し元スタブが `id-token: write` を宣言し、ここは継承する。
    # 同一リポ内でmainへ書き込む同期系ワークフローと直列化し、push競合を構造的に減らす。
    concurrency:
      group: cortex-repo-write-${{ github.repository }}
      cancel-in-progress: false
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: エンジンをチェックアウト（このワークフローと同一バージョン）
        uses: actions/checkout@v4
        with:
          repository: classmethod-team-app/cortex-engine
          ref: ${{ github.job_workflow_sha || inputs.engine_ref }}
          path: .cortex-engine
          token: ${{ secrets.ENGINE_REPO_TOKEN || github.token }}

      - name: エンジンをGit管理対象外にする
        run: echo ".cortex-engine/" >> .git/info/exclude

      # チェックアウトしたエンジンに、このワークフローが使うアクションが在るかを確かめる。
      # スタブの `uses: ...@<channel>` と `engine_ref` が揃っていないと**別の版**が落ちてきて、
      # `uses: ./…` がアクションを見つけられずジョブ全体が落ちる（実際にカナリアで起きた）。
      # ここで気づけるようにし、落とさずに従来の repo secret へ退避する。
      - name: エンジンの版が揃っているか確認
        if: steps.engineok.outputs.has == 'true'
        id: engineok
        run: |
          if [ -f .cortex-engine/.github/actions/fetch-secret/action.yml ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::warning::チェックアウトしたエンジンに fetch-secret がありません。スタブの engine_ref が uses: のチャンネルと揃っているか確認してください。従来の repo secret で続行します"
          fi

      # 設定UIから投入されたトークンは Secrets Manager に入る。無ければ従来の repo secret を使う
      # （移行していない案件が、エンジン更新の瞬間に一斉に止まらないようにするため）。
      # `secrets` は if: で直接参照できないので、一度 env に落としてから判定する。
      - name: AWSロールの有無を判定
        id: awsrole
        env:
          ROLE: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          if [ -n "${ROLE:-}" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi

      # 認証に失敗しても同期は止めない。フォールバック（repo secret）に落ちるだけにする。
      # スタブが id-token を宣言する前にエンジンだけ先に出ても、ここで止まらないようにするため。
      - name: AWS認証（Secrets Manager からトークンを取るため。未設定ならスキップ）
        id: awsauth
        if: steps.awsrole.outputs.has == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-northeast-1

      # 認証が壊れたときに黙ってフォールバックへ落ちると、「読めない」が「未設定」に丸まる。
      - name: AWS認証の失敗を記録（続行はする）
        if: steps.awsauth.outcome == 'failure'
        run: echo "::warning::AWS認証に失敗しました。従来の repo secret で続行します（設定UIから投入した値は効きません）"

      - name: Figmaトークンを取得
        if: steps.engineok.outputs.has == 'true'
        id: figma_token
        uses: ./.cortex-engine/.github/actions/fetch-secret
        with:
          kind: figma-token
          fallback: ${{ secrets.FIGMA_TOKEN }}

      - name: 設定の有無を確認
        id: conf
        run: |
          # figma.json の場所は案件でカスタマイズされ得る（例: デザイン/ ではなく Figma/）ため探索する
          FJ=$(find . -maxdepth 2 -name figma.json -not -path './node_modules/*' -not -path './.git/*' | head -1)
          echo "design_dir=$(dirname "${FJ:-デザイン/figma.json}")" >> "$GITHUB_OUTPUT"
          if [ -z "$FJ" ] || ! grep -q '"key"' "$FJ"; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "figma.json が未設定のためスキップします"
          elif [ -z "${{ steps.figma_token.outputs.value || secrets.FIGMA_TOKEN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "FIGMA_TOKEN が未設定のためスキップします"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ジッター待機（同時刻バースト回避）
        if: steps.conf.outputs.configured == 'true' && github.event_name == 'schedule'
        run: |
          # 全案件リポが同一cron時刻(12:45 UTC)に発火し、共有FIGMA_TOKENの
          # Tier1レート制限(Dev/FullシートでもOrgで20回/分程度)に同時に当たるのを避ける。
          # 共有トークンは1バケツ(per-token)なので、案件数が増えるほど同時刻バーストが効く。
          # 0〜1800秒(30分)のランダム待機で広めに分散する（数十案件規模まで20回/分内に収める狙い）。
          # 手動実行(workflow_dispatch)では待たない。
          wait=$((RANDOM % 1801))
          echo "同時刻バースト回避のため ${wait} 秒待機します"
          sleep "$wait"

      - name: 画面インベントリを同期
        if: steps.conf.outputs.configured == 'true'
        env:
          FIGMA_TOKEN: ${{ steps.figma_token.outputs.value || secrets.FIGMA_TOKEN }}
        run: python3 .cortex-engine/plugin/skills/sync-designs/scripts/sync_designs.py

      - name: DESIGN.md lint（公式仕様検証・best-effort）
        # 書き手（Python抽出）と検証者（公式linter）を分ける。落ちても同期は成功扱い。
        if: steps.conf.outputs.configured == 'true'
        continue-on-error: true
        run: |
          DMD="${{ steps.conf.outputs.design_dir }}/DESIGN.md"
          if [ -f "$DMD" ]; then
            npx -y @google/design.md@0.3.0 lint "$DMD"
          else
            echo "$DMD が無いためlintをスキップします"
          fi

      - name: コミット
        if: steps.conf.outputs.configured == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.conf.outputs.design_dir }}/"
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "デザインの画面インベントリを自動同期"
          fi

      - name: Push（競合時はrebaseで再試行）
        if: steps.conf.outputs.configured == 'true'
        uses: classmethod-team-app/cortex-engine/.github/actions/robust-push@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
